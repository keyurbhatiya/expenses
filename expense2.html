<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        income: '#10b981',
                        expense: '#ef4444'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        
        <header class="mb-8 text-center sm:text-left">
            <h1 class="text-3xl font-bold text-gray-900">Finance Tracker</h1>
            <p class="text-gray-500">Track your income and expenses simply.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-income">
                <p class="text-sm text-gray-500 font-medium">Total Income</p>
                <p class="text-2xl font-bold text-gray-900" id="totalIncome">$0.00</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-expense">
                <p class="text-sm text-gray-500 font-medium">Total Expense</p>
                <p class="text-2xl font-bold text-gray-900" id="totalExpense">$0.00</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-primary">
                <p class="text-sm text-gray-500 font-medium">Net Balance</p>
                <p class="text-2xl font-bold text-gray-900" id="netBalance">$0.00</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <section class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm h-fit sticky top-4">
                <h2 class="text-xl font-bold mb-4">Add Transaction</h2>
                <form id="trackerForm" class="space-y-4">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="type" value="Income" class="peer sr-only" required>
                                <div class="p-2 text-center border rounded-md peer-checked:bg-income peer-checked:text-white transition">Income</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="type" value="Expense" class="peer sr-only" checked required>
                                <div class="p-2 text-center border rounded-md peer-checked:bg-expense peer-checked:text-white transition">Expense</div>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label for="date" class="block text-sm font-medium text-gray-700">Date</label>
                        <input type="date" id="date" name="date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-2 border">
                    </div>

                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                        <select id="category" name="category" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-2 border">
                            <option>Food</option>
                            <option>Rent</option>
                            <option>Salary</option>
                            <option>Transport</option>
                            <option>Utilities</option>
                            <option>Entertainment</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div>
                        <label for="amount" class="block text-sm font-medium text-gray-700">Amount</label>
                        <input type="number" id="amount" name="amount" step="0.01" required placeholder="0.00" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-2 border">
                    </div>

                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                        <input type="text" id="description" name="description" placeholder="Short description..." class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-2 border">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-primary text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition flex justify-center items-center">
                        <span>Add Transaction</span>
                        <div id="spinner" class="hidden ml-2 w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </button>
                </form>
            </section>

            <section class="lg:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Recent History</h2>
                    <select id="filter" class="text-sm border-gray-300 rounded-md shadow-sm border p-1">
                        <option value="All">All</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>
                
                <div class="bg-white shadow-sm rounded-xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Details</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
                                </tr>
                            </thead>
                            <tbody id="transactionList" class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td colspan="3" class="px-6 py-4 text-center text-gray-500">Loading data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbwVSM88xGBoSVntmp1Um9VlbwLERz3_1DadzyHuvclHnjG4WuJUxHWtTIOsnYIgSner/exec';

        // DOM Elements
        const form = document.getElementById('trackerForm');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const listContainer = document.getElementById('transactionList');
        const filterSelect = document.getElementById('filter');
        
        let allTransactions = [];

        // Set today's date in input
        document.getElementById('date').valueAsDate = new Date();

        // --- Fetch Data ---
        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.status === 'success') {
                    allTransactions = result.data;
                    updateUI();
                }
            } catch (error) {
                console.error("Error loading data:", error);
                listContainer.innerHTML = `<tr><td colspan="3" class="text-center text-red-500 py-4">Error loading data. Check console.</td></tr>`;
            }
        }

        // --- Calculate & Update UI ---
        function updateUI() {
            const filterType = filterSelect.value;
            let income = 0;
            let expense = 0;

            // Filter
            const filtered = allTransactions.filter(t => filterType === 'All' || t.type === filterType);

            // Calculate Totals (based on ALL data, not just filtered view)
            allTransactions.forEach(t => {
                const amt = parseFloat(t.amount);
                if (t.type === 'Income') income += amt;
                if (t.type === 'Expense') expense += amt;
            });

            // Update Cards
            document.getElementById('totalIncome').textContent = formatCurrency(income);
            document.getElementById('totalExpense').textContent = formatCurrency(expense);
            document.getElementById('netBalance').textContent = formatCurrency(income - expense);

            // Render List
            renderTable(filtered);
        }

        function renderTable(data) {
            if (data.length === 0) {
                listContainer.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">No transactions found.</td></tr>';
                return;
            }

            listContainer.innerHTML = data.map(t => {
                const isIncome = t.type === 'Income';
                const dateObj = new Date(t.date);
                const formattedDate = dateObj.toLocaleDateString();
                const sign = isIncome ? '+' : '-';
                const colorClass = isIncome ? 'text-income' : 'text-expense';

                return `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formattedDate}</td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-gray-900">${t.category}</div>
                            <div class="text-sm text-gray-500">${t.description || ''}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-bold ${colorClass}">
                            ${sign}${formatCurrency(t.amount)}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- Submit Data ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading State
            submitBtn.disabled = true;
            submitBtn.querySelector('span').textContent = "Saving...";
            spinner.classList.remove('hidden');

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                // We use 'no-cors' mode is trickier with POST, so we send as text/plain
                // to avoid complex CORS preflight checks in GAS.
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                // Clear form and reload
                form.reset();
                document.getElementById('date').valueAsDate = new Date();
                
                // Optimistic UI update (optional, but we'll just reload for accuracy)
                await loadData();

            } catch (error) {
                alert('Error submitting transaction');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span').textContent = "Add Transaction";
                spinner.classList.add('hidden');
            }
        });

        // Filter Listener
        filterSelect.addEventListener('change', updateUI);

        // Helper
        function formatCurrency(num) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
        }

        // Init
        loadData();

    </script>
</body>
</html>
